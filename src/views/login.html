<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo"><i class="bi bi-piggy-bank-fill"></i></div>
        <h1>맑은 비용절감</h1>
        <p class="login-desc">맑은소프트 전사 비용절감 전략 대시보드</p>

        <form @submit.prevent="submit">
            <label class="form-label small fw-semibold mb-1">접근 비밀번호</label>
            <input
                ref="pw"
                v-model="password"
                type="password"
                class="form-control form-control-lg"
                :class="{ 'is-invalid': !!error }"
                placeholder="비밀번호를 입력하세요"
                autocomplete="current-password">
            <div v-if="error" class="invalid-feedback d-block">{{ error }}</div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mt-3" :disabled="loading">
                <span v-if="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? '확인 중...' : '입장하기' }}
            </button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
            회원가입 없이 비밀번호로만 입장합니다.
        </p>
    </div>
</div>
