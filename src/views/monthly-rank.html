<div class="container">

    <h1 class="h4 fw-bold mb-3">월비용 순위</h1>

    <!-- 로딩 -->
    <div v-if="!loaded" class="text-center text-muted py-5">
        <div class="spinner-border text-primary mb-2"></div>
        <div>데이터를 불러오는 중...</div>
    </div>

    <template v-else>
        <!-- 비용항목 월비용 순위 (1~4월 월평균) -->
        <div class="card">
            <div class="card-body">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
                    <div class="card-title-sm mb-0">
                        비용항목 월비용 순위 — {{ modeLabel }}
                        <span class="text-muted">({{ filteredByItem.length }} / {{ byItem.length }}건)</span>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <!-- 보기 기준: 월평균 / 특정 월 -->
                        <select class="form-select form-select-sm w-auto" v-model="selectedMonth">
                            <option v-for="op in monthOptions" :key="op.value" :value="op.value">{{ op.label }}</option>
                        </select>

                        <!-- 항목 멀티 선택 -->
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle filter-btn-multi"
                                    type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                                {{ itemLabel() }}
                            </button>
                            <div class="dropdown-menu p-2 filter-dd-menu">
                                <label class="dropdown-item d-flex align-items-center gap-2 py-1 m-0">
                                    <input type="checkbox" class="form-check-input m-0"
                                           :checked="selectedItems.length === itemOptions.length"
                                           :indeterminate.prop="selectedItems.length > 0 && selectedItems.length < itemOptions.length"
                                           @change="toggleAllItems">
                                    <span class="fw-semibold">전체</span>
                                </label>
                                <hr class="dropdown-divider my-1">
                                <label v-for="op in itemOptions" :key="op"
                                       class="dropdown-item d-flex align-items-center gap-2 py-1 m-0">
                                    <input type="checkbox" class="form-check-input m-0"
                                           :value="op" v-model="selectedItems">
                                    <span>{{ op }}</span>
                                </label>
                            </div>
                        </div>

                        <!-- 분류 멀티 선택 (항목 선택 시에만 표시) -->
                        <div v-if="selectedItems.length" class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle filter-btn-multi"
                                    type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                                    :disabled="!categoryOptions.length">
                                {{ categoryLabel() }}
                            </button>
                            <div class="dropdown-menu p-2 filter-dd-menu">
                                <label class="dropdown-item d-flex align-items-center gap-2 py-1 m-0">
                                    <input type="checkbox" class="form-check-input m-0"
                                           :checked="selectedCategories.length === categoryOptions.length"
                                           :indeterminate.prop="selectedCategories.length > 0 && selectedCategories.length < categoryOptions.length"
                                           @change="toggleAllCategories">
                                    <span class="fw-semibold">전체</span>
                                </label>
                                <hr class="dropdown-divider my-1">
                                <label v-for="op in categoryOptions" :key="op"
                                       class="dropdown-item d-flex align-items-center gap-2 py-1 m-0">
                                    <input type="checkbox" class="form-check-input m-0"
                                           :value="op" v-model="selectedCategories">
                                    <span>{{ op }}</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-if="!filteredByItem.length" class="text-center text-muted py-4">표시할 항목이 없습니다.</div>
                <div class="item-row" v-for="(r, ri) in filteredByItem" :key="ri">
                    <div class="item-meta">
                        <div class="item-rank">{{ r.rank }}.</div>
                        <div class="item-meta-text">
                            <div class="item-name" :title="r.item">{{ r.item }}</div>
                            <div class="item-cat" :title="r.category">{{ r.category || '-' }}</div>
                        </div>
                    </div>
                    <div class="item-bar">
                        <div class="item-detail" :title="r.detailFull">{{ r.detailFull }}</div>
                        <div class="bar-track">
                            <div class="bar-fill" :style="{ width: width(r.total, filteredByItem) }"></div>
                        </div>
                    </div>
                    <div class="bar-value">{{ short(r.total) }}</div>
                </div>
            </div>
        </div>
    </template>

</div>
